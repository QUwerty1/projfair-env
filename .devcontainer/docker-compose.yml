# Dev-окружение projfair.
#   app      — PHP 8.1 + Composer + Node (собирается из .devcontainer/Dockerfile)
#   db       — MySQL 8.0; при первом создании тома db-data импортирует projectfair.sql
#   mailpit  — перехват писем (SMTP :1025, веб-интерфейс :8025)
#
# Запуск вне VS Code:
#   docker compose -p projfair -f .devcontainer/docker-compose.yml up -d
#   docker compose -p projfair -f .devcontainer/docker-compose.yml exec app bash

name: projfair

services:
  app:
    build: .
    image: projfair-dev:latest
    volumes:
      - ..:/workspaces/projfair:cached
      # Кэши пакетов вне репозитория, чтобы не инвалидировать vendor/node_modules
      - composer-cache:/home/vscode/.composer/cache
      - npm-cache:/home/vscode/.npm
      # zz- в имени — чтобы подключаться после xdebug.ini базового образа (см. php.ini)
      - ./php.ini:/usr/local/etc/php/conf.d/zz-projfair.ini:ro
    ports:
      - "8000:8000"   # php artisan serve
      - "3000:3000"   # vite dev-сервер
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    # Держит контейнер запущенным; сервисы стартуют вручную или задачами VS Code
    command: sleep infinity

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: projectfair
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
      # Импортируется один раз, когда том db-data пуст.
      # Вернуть БД к дампу: задача "db: переимпорт дампа" или
      # `docker compose -p projfair -f .devcontainer/docker-compose.yml down -v`
      - ./projectfair.sql:/docker-entrypoint-initdb.d/projectfair.sql:ro
    command: mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --skip-log-bin
    # Пока идёт импорт дампа, MySQL слушает только сокет, поэтому ping по TCP
    # проходит лишь после импорта — app стартует уже с заполненной базой.
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  mailpit:
    image: axllent/mailpit:v1.29
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI

volumes:
  db-data:
  composer-cache:
  npm-cache:
