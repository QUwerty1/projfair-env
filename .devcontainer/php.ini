; Настройки PHP для локальной разработки projfair.
; Исходный проектный _docker/app/php.ini сохранён без изменений, здесь только dev-удобства.
memory_limit = 512M
max_execution_time = 120
max_input_time = 120
upload_max_filesize = 32M
post_max_size = 32M

; Показывать ошибки PHP в выводе (логирование Laravel в storage/logs это не отключает).
display_errors = On
display_startup_errors = On
error_reporting = E_ALL

; Xdebug 3.x приходит в образ уже установленным; по умолчанию отключаем его,
; чтобы artisan/composer не замедлялись и не сыпали ошибки подключения в лог.
; Включать адресно: php -d xdebug.mode=debug artisan serve --host=0.0.0.0 --port=8000
; Отладчик VS Code (PHP Debug) работает внутри этого же контейнера,
; поэтому client_host оставлен по умолчанию — localhost.
xdebug.mode = off
xdebug.client_port = 9003
xdebug.discover_client_host = false
xdebug.idekey = vscode
